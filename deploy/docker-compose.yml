# MediaForge —— 纯拉镜像部署（无需源码 / no source needed）
# 用法 / Usage:
#   1) 把本文件和 .env.example 下载到同一个目录
#   2) cp .env.example .env  然后编辑 .env 填写你自己的密钥和路径
#   3) docker compose up -d
# 完整教程 / Full guide: https://github.com/lipin113/mediaforge/wiki/Docker-and-Linux
#
# 镜像已托管在阿里云镜像仓库（公开，双架构 amd64/arm64，无需登录即可拉取）。
# Image is hosted on Alibaba Cloud ACR (public, multi-arch amd64/arm64).

services:
  # 预处理：把宿主机媒体/STRM目录准备成可传播挂载点（rshared），保证网盘挂载在宿主机本地可见。
  # Prepares host media/STRM dirs as shared mounts so FUSE mounts are visible on the host.
  mediaforge-prepare:
    image: ${FSM_IMAGE_NAME:-crpi-d1fqcfhokj0htk9o.cn-shenzhen.personal.cr.aliyuncs.com/mediafore/mediaforge:latest}
    container_name: ${FSM_CONTAINER_NAME:-mediaforge}-prepare
    privileged: true
    pid: host
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -eu
        for t in "${FSM_MEDIA_HOST_PATH:?set FSM_MEDIA_HOST_PATH in .env}" "${FSM_STRM_HOST_PATH:?set FSM_STRM_HOST_PATH in .env}"; do
          nsenter -t 1 -m -- sh -lc '
            set -eu
            mkdir -p "$$1"
            grep -F " $$1 " /proc/self/mountinfo >/dev/null 2>&1 || mount --bind "$$1" "$$1"
            mount --make-rshared "$$1"
          ' sh "$$t"
        done
    restart: "no"

  mediaforge:
    image: ${FSM_IMAGE_NAME:-crpi-d1fqcfhokj0htk9o.cn-shenzhen.personal.cr.aliyuncs.com/mediafore/mediaforge:latest}
    container_name: ${FSM_CONTAINER_NAME:-mediaforge}
    depends_on:
      mediaforge-prepare:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      FSM_MASTER_KEY: ${FSM_MASTER_KEY:?set FSM_MASTER_KEY in .env}
      FSM_SESSION_SECRET: ${FSM_SESSION_SECRET:?set FSM_SESSION_SECRET in .env}
      FSM_PROXY_TOKEN: ${FSM_PROXY_TOKEN:?set FSM_PROXY_TOKEN in .env}
      FSM_HTTP_LISTEN: ${FSM_HTTP_LISTEN:-:7860}
      FSM_PROXY_LISTEN: ${FSM_PROXY_LISTEN:-:17860}
      FSM_DATA_ROOT: /app/data
      FSM_MOUNT_CACHE_DIR: /app/data/cache
      FSM_MOUNT_HOST_PATH_PREFIX: ${FSM_MEDIA_HOST_PATH:?set FSM_MEDIA_HOST_PATH in .env}
      FSM_MOUNT_RUNTIME_PATH_PREFIX: ${FSM_MEDIA_CONTAINER_PATH:-/mnt/media}
      FSM_DOCKER_HAIRPIN_FIX_ENABLED: ${FSM_DOCKER_HAIRPIN_FIX_ENABLED:-true}
    volumes:
      - ${FSM_DATA_HOST_PATH:-./data}:/app/data

      - type: bind
        source: ${FSM_MEDIA_HOST_PATH:?set FSM_MEDIA_HOST_PATH in .env}
        target: ${FSM_MEDIA_CONTAINER_PATH:-/mnt/media}
        bind:
          propagation: ${FSM_MEDIA_BIND_PROPAGATION:-rshared}

      - type: bind
        source: ${FSM_STRM_HOST_PATH:?set FSM_STRM_HOST_PATH in .env}
        target: ${FSM_STRM_CONTAINER_PATH:-/strm}
